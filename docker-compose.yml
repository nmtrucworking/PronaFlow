version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: pronaflow-db
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-pronaflow}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pronaflow-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pronaflow-cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pronaflow-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # FastAPI Backend
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: pronaflow-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PYTHON_ENV: ${PYTHON_ENV:-development}
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@database:5432/${DATABASE_NAME:-pronaflow}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
      - /app/__pycache__
    networks:
      - pronaflow-network
    restart: unless-stopped
    command: >
      sh -c "cd /app && 
             alembic upgrade head &&
             python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  # React Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: pronaflow-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
      VITE_APP_NAME: ${VITE_APP_NAME:-PronaFlow}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    networks:
      - pronaflow-network
    restart: unless-stopped
    command: npm run dev

  # AI Service
  ai-service:
    build:
      context: ./services/ai-serving
      dockerfile: Dockerfile
    container_name: pronaflow-ai
    environment:
      PYTHON_ENV: ${PYTHON_ENV:-development}
      AI_HOST: 0.0.0.0
      AI_PORT: 8001
      REDIS_URL: redis://redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${AI_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/ai-serving:/app
      - ai_models:/app/models
      - /app/__pycache__
    networks:
      - pronaflow-network
    restart: unless-stopped
    command: >
      sh -c "cd /app && 
             python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8001"

  # Nginx Reverse Proxy (Optional - for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: pronaflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pronaflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ai_models:
    driver: local

networks:
  pronaflow-network:
    driver: bridge
